name: Deploy Aplicação TechChallenge

on:
  push:
    branches:
      - main  # Permite o deploy apenas na main, protegida via PR

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_REPO: tech-challenge-app
          IMAGE_TAG: latest
        run: |
          docker build -t $IMAGE_REPO:$IMAGE_TAG -f Dockerfile .
          docker tag $IMAGE_REPO:$IMAGE_TAG $ECR_REGISTRY/$IMAGE_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$IMAGE_REPO:$IMAGE_TAG

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region sa-east-1 --name techchallenge-eks

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/db/
          kubectl apply -f k8s/app/
