name: Deploy to EKS

on:
  push:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        run: |
          IMAGE_REPO=tech-challenge-app
          IMAGE_TAG=latest
          docker build -t $IMAGE_REPO:$IMAGE_TAG -f Dockerfile .
          docker tag $IMAGE_REPO:$IMAGE_TAG ${{ steps.login-ecr.outputs.registry }}/$IMAGE_REPO:$IMAGE_TAG
          docker push ${{ steps.login-ecr.outputs.registry }}/$IMAGE_REPO:$IMAGE_TAG

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region sa-east-1 --name techchallenge-eks

      - name: Deploy manifests to EKS
        run: |
          kubectl apply -f db/
          kubectl apply -f app/
